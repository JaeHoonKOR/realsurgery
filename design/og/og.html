<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../public/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:"Pretendard Variable",sans-serif;background:#fff;color:#191f28;display:flex;padding:72px 80px;gap:56px;align-items:center;word-break:keep-all}
.l{flex:1}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.03em}
.mark{width:48px;height:48px}
h1{margin-top:44px;font-size:68px;line-height:1.18;letter-spacing:-.035em;font-weight:800}
p{margin-top:24px;font-size:26px;color:#4e5968;line-height:1.5;letter-spacing:-.01em}
.card{width:440px;background:#f2f4f6;border-radius:36px;padding:28px}
.in{background:#fff;border-radius:26px;padding:30px 30px 26px;box-shadow:0 12px 32px rgb(25 31 40/.1)}
.k{font-size:19px;color:#6b7684;font-weight:600}
.v{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.row{margin-top:20px}
.rt{display:flex;justify-content:space-between;font-size:18px;color:#4e5968}
.rt b{color:#191f28;font-weight:700}
.bar{margin-top:10px;height:12px;border-radius:99px;background:#f2f4f6;position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:99px;background:#3182f6}
</style></head><body>
<div class="l">
 <div class="logo"><svg class="mark" viewBox="0 0 28 28"><rect width="28" height="28" rx="8" fill="#3182f6"/><rect x="6" y="9" width="16" height="3.5" rx="1.75" fill="#fff"/><rect x="11" y="15.5" width="11" height="3.5" rx="1.75" fill="#fff" fill-opacity=".7"/></svg>리얼성형</div>
 <h1>시술 가격·회복기간,<br>한 번에 비교</h1>
 <p>병원 공개 가격과 학회 자료를<br>같은 기준으로 정리했습니다</p>
</div>
<div class="card"><div class="in">
 <div class="k">쌍꺼풀 수술 · 병원 공개 가격</div>
 <div class="v">50만~250만 원</div>
 <div class="row"><div class="rt"><b>A 병원</b><span>55만~160만</span></div><div class="bar"><i style="left:3%;width:52%"></i></div></div>
 <div class="row"><div class="rt"><b>B 병원</b><span>60만~180만</span></div><div class="bar"><i style="left:5%;width:60%"></i></div></div>
 <div class="row"><div class="rt"><b>C 병원</b><span>70만~220만</span></div><div class="bar"><i style="left:10%;width:75%"></i></div></div>
</div></div>
</body></html>
