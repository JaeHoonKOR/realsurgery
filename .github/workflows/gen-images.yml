name: Generate images (Gemini)
# 비용이 드는 작업(1장 $0.034~0.05). 요청 형식 content/images/request.json: { "batch": 1, "max": 50, "run": 1 } 또는 { "ids": "a,b", ... }. 실행 조건: feat/** 브랜치에서 content/images/request.json 이 바뀐 push, 또는 수동 실행.
# 결과(후보 이미지 + 실행 로그)는 검토용 브랜치 gen-images 에 커밋한다. 배포(main)와 무관.
# 필요: 저장소 Settings → Secrets and variables → Actions → GEMINI_API_KEY
on:
  push:
    branches: ["feat/**"]
    paths: ["content/images/request.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen-images
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock sharp@0.34
      - name: Generate
        env:
          # Repository secret 우선, 없으면 Actions variable·흔한 이름까지 찾는다(값은 로그에 남기지 않음)
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ vars.GEMINI_API_KEY }}
          K3: ${{ secrets.GEMINI_KEY }}
          K4: ${{ vars.GEMINI_KEY }}
          K5: ${{ secrets.GOOGLE_API_KEY }}
          K6: ${{ vars.GOOGLE_API_KEY }}
        run: |
          set -o pipefail
          GEMINI_API_KEY=""
          for n in K1 K2 K3 K4 K5 K6; do v="${!n}"; if [ -n "$v" ]; then GEMINI_API_KEY="$v"; echo "키 출처: $n (K1/K2=GEMINI_API_KEY secret/var, K3/K4=GEMINI_KEY, K5/K6=GOOGLE_API_KEY)"; break; fi; done
          export GEMINI_API_KEY
          REQ=content/images/request.json
          SEL=$(node -p "const r=require('./$REQ'); r.ids ? '--ids '+r.ids : '--batch '+r.batch")
          MAX=$(node -p "require('./$REQ').max")
          RUN=$(node -p "require('./$REQ').run")
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          mkdir -p .gen-candidates
          node scripts/gen-images.mjs $SEL --max "$MAX" --out-dir .gen-candidates 2>&1 | tee .gen-candidates/log.txt
      - name: Commit candidates and log to gen-images branch
        if: always()
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cand && cp .gen-candidates/* /tmp/cand/ 2>/dev/null || true
          git fetch origin gen-images || true
          if git rev-parse --verify origin/gen-images >/dev/null 2>&1; then
            git checkout -f -B gen-images origin/gen-images
          else
            git checkout -f --orphan gen-images && git rm -rfq . && git clean -fdq
          fi
          mkdir -p candidates logs
          cp /tmp/cand/*.webp candidates/ 2>/dev/null || true
          cp /tmp/cand/log.txt "logs/run-${RUN:-manual}.txt" 2>/dev/null || echo "로그 없음(생성 단계 전에 실패)" > "logs/run-${RUN:-manual}.txt"
          git add candidates logs
          git commit -m "chore(images): Gemini 후보 (request run ${RUN:-manual})" || exit 0
          git push origin gen-images
