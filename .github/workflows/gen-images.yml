name: Generate images (Gemini)
# 수동 실행 전용 — 비용이 드는 작업이다(1장 약 $0.05). 결과는 검토용 브랜치 gen-images 에 커밋한다.
# 필요: 저장소 Settings → Secrets and variables → Actions → GEMINI_API_KEY
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "prompts.json id 목록(쉼표) 또는 all"
        default: all
      variants:
        description: "id 당 후보 수"
        default: "1"
      max:
        description: "이번 실행 최대 장수(비용 상한)"
        default: "30"
permissions:
  contents: write
concurrency:
  group: gen-images
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock sharp@0.34
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gen-images.mjs --ids "${{ inputs.ids }}" --variants "${{ inputs.variants }}" --max "${{ inputs.max }}" --out-dir .gen-candidates
      - name: Commit candidates to gen-images branch
        if: always()
        run: |
          shopt -s nullglob
          files=(.gen-candidates/*.webp)
          if [ ${#files[@]} -eq 0 ]; then echo "생성된 파일 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cand && cp .gen-candidates/*.webp /tmp/cand/
          git fetch origin gen-images || true
          if git rev-parse --verify origin/gen-images >/dev/null 2>&1; then
            git checkout -B gen-images origin/gen-images
          else
            git checkout --orphan gen-images && git rm -rfq . && git clean -fdq -e .gen-candidates
          fi
          mkdir -p candidates && cp /tmp/cand/*.webp candidates/
          git add candidates
          git commit -m "chore(images): Gemini 후보 ${#files[@]}장 (${{ inputs.ids }})" || exit 0
          git push origin gen-images
