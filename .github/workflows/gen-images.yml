name: Generate images (Gemini)
# 비용이 드는 작업(1장 약 $0.05). 실행 조건: feat/** 브랜치에서 content/images/request.json 이 바뀐 push, 또는 수동 실행.
# 결과(후보 이미지 + 실행 로그)는 검토용 브랜치 gen-images 에 커밋한다. 배포(main)와 무관.
# 필요: 저장소 Settings → Secrets and variables → Actions → GEMINI_API_KEY
on:
  push:
    branches: ["feat/**"]
    paths: ["content/images/request.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gen-images
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock sharp@0.34
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          REQ=content/images/request.json
          IDS=$(node -p "require('./$REQ').ids")
          VARIANTS=$(node -p "require('./$REQ').variants")
          MAX=$(node -p "require('./$REQ').max")
          RUN=$(node -p "require('./$REQ').run")
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          mkdir -p .gen-candidates
          node scripts/gen-images.mjs --ids "$IDS" --variants "$VARIANTS" --max "$MAX" --out-dir .gen-candidates 2>&1 | tee .gen-candidates/log.txt
      - name: Commit candidates and log to gen-images branch
        if: always()
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cand && cp .gen-candidates/* /tmp/cand/ 2>/dev/null || true
          git fetch origin gen-images || true
          if git rev-parse --verify origin/gen-images >/dev/null 2>&1; then
            git checkout -f -B gen-images origin/gen-images
          else
            git checkout -f --orphan gen-images && git rm -rfq . && git clean -fdq
          fi
          mkdir -p candidates logs
          cp /tmp/cand/*.webp candidates/ 2>/dev/null || true
          cp /tmp/cand/log.txt "logs/run-${RUN:-manual}.txt" 2>/dev/null || echo "로그 없음(생성 단계 전에 실패)" > "logs/run-${RUN:-manual}.txt"
          git add candidates logs
          git commit -m "chore(images): Gemini 후보 (request run ${RUN:-manual})" || exit 0
          git push origin gen-images
