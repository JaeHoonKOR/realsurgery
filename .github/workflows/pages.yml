name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1,4"
# 기본 권한은 읽기만(pages: read 는 build job 의 configure-pages 가 Pages 설정을 조회하는 데 필요).
# 배포 권한(pages: write·id-token: write)은 main 의 deploy job 에만 준다 — PR 빌드에는 부여하지 않음.
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # 블록 스칼라(|) 필수: 평문 스칼라 안의 "apikey: " 는 YAML 매핑으로 해석돼 워크플로 전체가 파싱 오류가 난다.
      - run: |
          curl -fsS "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/categories?select=id&limit=1" -H "apikey: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" || true
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # 액션은 Node 24 런타임 메이저로 고정(2026-10-25 Actions 경고 "Node.js 20 is deprecated" 대응).
      # 앱 빌드용 Node 는 아래 node-version 으로 따로 정한다.
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Pages 설정에서 base_path(/realsurgery, 커스텀 도메인이면 "")·base_url 을 읽는다.
      # Variables 에 NEXT_PUBLIC_BASE_PATH·NEXT_PUBLIC_SITE_URL 이 있으면 그 값이 우선.
      - id: pages
        uses: actions/configure-pages@v6
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}
          NEXT_PUBLIC_NAVER_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_NAVER_ANALYTICS_ID }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
      - run: pnpm typecheck
      - run: touch out/.nojekyll
      # v4+ 는 점(.)으로 시작하는 파일을 기본 제외 → .nojekyll 을 넣기 위해 include-hidden-files (v5 입력)
      - uses: actions/upload-pages-artifact@v5
        with: { path: out, include-hidden-files: true }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
